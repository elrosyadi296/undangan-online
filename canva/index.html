<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital - Rara & Rosyadi</title>
    
    <!-- Tailwind CSS untuk tata letak yang bersih -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Menghilangkan scrollbar dan margin agar video benar-benar memenuhi layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Latar belakang hitam agar transisi terasa mulus */
        }

        /* Container utama untuk menjaga aspek rasio video seluler (9:16) */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Memastikan iframe video responsif dan memenuhi layar dengan rasio yang tepat */
        .video-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 
          Embed Canva Video 9:16 
          Ditambahkan parameter:
          - ?embed : Mode semat standar Canva
          - &autoplay=1 : Memerintahkan video langsung berputar otomatis saat dimuat
          - &mute=1 : Wajib di-mute agar browser mengizinkan fitur Autoplay berjalan secara instan
        -->
        <iframe 
            class="video-iframe"
            src="https://www.canva.com/design/DAHLxEUKPEI/scZBIIRxcp3Z6greM4T9ew/watch?embed&autoplay=1&mute=1" 
            allowfullscreen="allowfullscreen" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

</body>
</html>
